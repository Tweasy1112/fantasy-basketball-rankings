
name: Update NBA Injuries

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15,20,23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pip install nbainjuries

      - name: Fetch latest official report
        run: python scripts/update_injuries.py

      - name: Commit latest successful snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.json
          git diff --cached --quiet || git commit -m "Update NBA injury snapshot"
          git push
